<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <nav>
        <table cellpadding="1" cellspacing="3">
            <th>
                <tr>
                    <td>
                        <a href="index.html">Home</a>|

                        <a href="media.html">Media</a>|
                        <a href="contact.html">Contact</a>

                    </td>
                </tr>
            </th>
        </table>
    </nav>
    <hr>
    <header><h3>Registration Form</h3></header>
    <main>
        <form action="#">
            <fieldset>
                <legend>Personal Info</legend>
            <label for="name">Name</label>
            <input type="text" name="name" id="name" maxlength="12" minlength="3" placeholder="Enter your name">
            <br><br>
            <label for="fname">F.Name</label>
            <input type="text" name="fname" id="fname" placeholder="Enter Your Father Name">
                <br><br>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="you@gmail.com">
            
                <br><br>
            <label for="password">Password<font color="red">*</font></label>
            <input type="password" name="password" id="password" required pattern="[A-za-z0-9]">
                <br><br>
            <label for="age">Age</label>
            <input type="number" name="age" id="age" min="18" max="28">
            <br><br>
            <label for="dob">Date of Birth</label>
            <input type="date" name="dob" id="dob">
            <!-- <br><br> -->
            <p>
                Gender:
                <input type="radio" name="gender" id="male" value="male">
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female">Female</label>
            </p>
            </fieldset><br>

            <fieldset>
                <legend>Hobbies</legend>
            <p><label for="hobbies">Hobbies:</label>
            <input type="checkbox" name="coding" id="coding">
            <label for="coding">Coding</label>
            <input type="checkbox" name="gaming" id="gaming">
            <label for="gaming">Gaming</label>
            <input type="checkbox" name="sports" id="sports">
            <label for="sports">Sports</label>
            <input type="checkbox"  name="Reading" id="Reading">
            <label for="Reading">Reading</label></p>
            </fieldset><br>

            <fieldset>
                <legend>Select City</legend>
            <label for="city">Select City:</label>
            <select name="city" id="city">
                <option value="Peshawar">Select City</option>
                <option value="Peshawar">Peshawar</option>
                <option value="Lahore">Lahore</option>
                <option value="Karachi">Karachi</option>
            </select>
            <p>
            </fieldset>
            <br>

            <fieldset>
                <legend>Give Your Feedback</legend>
            <label for="message">Feedback:</label><br>
            <textarea name="message" id="message" placeholder="please give your valueable feedback!" rows="5" cols="40" maxlength="200"></textarea></p>

            </fieldset><br>

            <p>
                <label for="url">URL</label>
                <input type="url" name="url" id="url">
            </p>

            <p>
                <label for="file">Submit File</label>
                <input type="file" name="file" id="file" multiple="true">
            </p>

            <p>
            <input type="submit" name="submit" id="submit" value="submit">

            <input type="reset" name="" id="" value="reset">
            </p>

            <p>
                <label for="button">Login</label>
                <input type="button" name="button" id="button" value="Login" onclick="alert('Login Successfull')">
            </p>

        </form>
    </main>
</body>
</html>
